<!doctype html><html><head><meta charset="utf-8"><title>AI Code Review</title><style>body{font-family:Inter,system-ui;max-width:1000px;margin:40px auto;padding:0 20px;background:#0b1020;color:#eef}textarea{width:100%;height:320px;background:#11182b;color:#fff;border:1px solid #34405c;border-radius:12px;padding:16px}button{margin-top:12px;padding:12px 20px;border:0;border-radius:10px;cursor:pointer}.card{margin-top:20px;padding:18px;background:#11182b;border-radius:12px}pre{white-space:pre-wrap}</style></head><body><h1>AI Code Review</h1><p>AST analysis + security findings + optional LLM explanation.</p><textarea id="code">def example(x):\n    return eval(x)</textarea><button onclick="review()">Review Code</button><div id="out" class="card"></div><script>async function review(){const r=await fetch('/api/v1/review/explain',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({language:'python',code:document.getElementById('code').value})});const d=await r.json();document.getElementById('out').innerHTML='<h2>Score: '+d.score+'</h2><pre>'+JSON.stringify(d,null,2)+'</pre>'}</script></body></html>
